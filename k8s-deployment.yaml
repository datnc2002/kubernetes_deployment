# ============================================================
# ConfigMap: Chứa file config JSON cho job ETL
# Cấu hình cho bài toán TLC HVFHV 2021 với 5 KPIs
# ============================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-etl-sa
  namespace: spark-etl

--- 
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-etl-role-binding
  namespace: spark-etl
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
- kind: ServiceAccount
  name: spark-etl-sa
  namespace: spark-etl
--- 
apiVersion: v1
kind: ConfigMap
metadata:
  name: etl-job-config
  namespace: spark-etl
data:
  etl-config.json: |
    {
      "appName": "TLC_HVFHV_2021_KPI",
      "transformMode": "custom",
      "transformName": "tlc_hvfhv_kpi",
      "source": {
        "path": "gs://k8s-deployment-bucket-datnc/raw/trips/",
        "format": "parquet",
        "options": {}
      },
      "extraSources": {
        "dimension": {
          "path": "gs://k8s-deployment-bucket-datnc/raw/taxi_zone_lookup/",
          "format": "csv",
          "options": {
            "header": "true",
            "inferSchema": "true"
          }
        }
      },
      "sink": {
        "path": "gs://k8s-deployment-bucket-datnc/output/kpi/total_trips_by_zone/",
        "format": "parquet",
        "mode": "overwrite",
        "coalesceNum": 1
      },
      "dlqPath": "gs://k8s-deployment-bucket-datnc/dlq/"
    }

---
# ============================================================
# Job: Chạy Spark ETL batch job
# - Tài nguyên đã tối ưu cho worker node 2 vCPU / 2GB RAM
# - Bật Event Log → Spark History Server đọc được
# ============================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: spark-etl-job
  namespace: spark-etl
  labels:
    app: spark-etl
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: spark-etl
    spec:
      restartPolicy: Never
      serviceAccountName: spark-etl-sa

      containers:
      - name: spark-etl-container
        image: ${IMAGE_TAG}
        imagePullPolicy: Always

        env:
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: "/etc/gcp/key.json"
        - name: SPARK_DRIVER_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.podIP

        # spark-submit với cấu hình tối ưu cho node 2GB RAM
        command:
        - "/opt/spark/bin/spark-submit"
        args:
        - "--master"
        - "k8s://https://10.148.0.3:6443"
        - "--deploy-mode"
        - "client"
        - "--class"
        - "com.etl.SparkETLApp"
        # ── Tài nguyên Spark ──
        - "--conf"
        - "spark.driver.host=$(SPARK_DRIVER_HOST)"
        - "--conf"
        - "spark.driver.memory=800m"
        - "--conf"
        - "spark.executor.memory=2g"
        - "--conf"
        - "spark.executor.cores=2"
        - "--conf"
        - "spark.kubernetes.namespace=spark-etl"
        - "--conf"
        - "spark.kubernetes.container.image=${IMAGE_TAG}"
        - "--conf"
        - "spark.executor.instances=3"
        # ── GCS Auth (dùng JSON key mount từ K8s Secret) ──
        - "--conf"
        - "spark.hadoop.google.cloud.auth.service.account.enable=true"
        - "--conf"
        - "spark.hadoop.google.cloud.auth.service.account.json.keyfile=/etc/gcp/key.json"
        - "--conf"
        - "spark.hadoop.fs.gs.impl=com.google.cloud.hadoop.fs.gcs.GoogleHadoopFileSystem"
        - "--conf"
        - "spark.hadoop.fs.AbstractFileSystem.gs.impl=com.google.cloud.hadoop.fs.gcs.GoogleHadoopFS"
        # ── Event Log (cho Spark History Server) ──
        - "--conf"
        - "spark.eventLog.enabled=true"
        - "--conf"
        - "spark.eventLog.dir=gs://k8s-deployment-bucket-datnc/spark-events/"
        # ── KPI basePath (để CustomTransforms ghi 5 thư mục riêng) ──
        - "--conf"
        - "spark.etl.kpi.basePath=gs://k8s-deployment-bucket-datnc/output/kpi"
        # ── JAR path ──
        - "/opt/spark/work-dir/jars/spark-etl.jar"
        # ── Config file path (mount từ ConfigMap) ──
        - "/opt/spark/work-dir/config/etl-config.json"

        # Tài nguyên container — phù hợp node 2 vCPU / 2GB RAM
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "1536Mi"

        volumeMounts:
        - name: etl-config-volume
          mountPath: /opt/spark/work-dir/config
          readOnly: true
        - name: gcp-key-volume
          mountPath: /etc/gcp
          readOnly: true

      volumes:
      - name: etl-config-volume
        configMap:
          name: etl-job-config
      - name: gcp-key-volume
        secret:
          secretName: gcp-key