name: CI/CD Data Pipeline Deployment

on:
  push:
    branches: [ "main" ]

env:
  IMAGE_NAME: my-app
  DEPLOYMENT_NAME: my-app-deployment
  CONTAINER_NAME: my-app-container

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set Image Tag
      id: vars
      run: echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

    - name: Build and Push Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:v-${{ env.COMMIT_SHA }}

    - name: Configure Kubernetes Context
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBE_CONFIG_BASE64 }}" | base64 --decode > ~/.kube/config
        chmod 600 ~/.kube/config

    # [KHỐI THỰC THI MỚI] - Thay thế toàn bộ bước Deploy cũ
    - name: Deploy to GCP Kubernetes (Declarative)
      run: |
        export IMAGE_TAG="${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:v-${{ env.COMMIT_SHA }}"
        echo "Bản build hiện tại: $IMAGE_TAG"
        
        # 1. Chốt chặn: Kiểm tra file template có tồn tại trên GitHub Repo không
        if [ ! -f "k8s-deployment.yaml" ]; then
          echo "LỖI TÀI LIỆU: Không tìm thấy file k8s-deployment.yaml ở thư mục gốc."
          exit 1
        fi
        
        # 2. Tiêm biến môi trường vào template, sinh ra file manifest cuối cùng
        envsubst < k8s-deployment.yaml > final-k8s-manifest.yaml
        
        # 3. Chốt chặn Observability: In file cuối cùng ra log để rà soát (ẩn các secret)
        echo "=== NỘI DUNG FILE MANIFEST SẼ TRIỂN KHAI ==="
        cat final-k8s-manifest.yaml
        echo "==========================================="
        
        # 4. Kích hoạt K8s đồng bộ trạng thái (Đảm bảo Idempotency)
        # Tuyệt đối KHÔNG có lệnh kubectl set image ở đây nữa
        kubectl apply -f final-k8s-manifest.yaml
        
        # 5. Kiểm soát Rollout
        kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} --timeout=120s